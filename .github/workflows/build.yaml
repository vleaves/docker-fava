name: Publish Docker image

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push Docker image to Alibaba Cloud ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_REPO: ${{ secrets.ACR_REPO }}
        run: |
          printf '%s' "$ACR_PASSWORD" | docker login \
            --username "$ACR_USERNAME" \
            "$ACR_REGISTRY" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t "$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPO:latest" .

      - name: Push Docker Image to ACR
        run: |
          docker push "$ACR_REGISTRY/$ACR_NAMESPACE/$ACR_REPO:latest"
